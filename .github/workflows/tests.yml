name: Tests

# Гейт на пути feature → dev → main. Релизные workflow (publish, codex-plugin)
# висят только на main, поэтому без этого прогона поломка, попавшая в dev,
# всплывает лишь после мержа в main и блокирует публикацию.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,web]" uv
      # uv.lock — отслеживаемый источник воспроизводимого разрешения зависимостей.
      - run: uv lock --check
      # Раньше полного прогона: рассинхрон сгенерированных манифестов плагина
      # с версией pyproject даёт здесь одну внятную строку вместо десятка
      # падений в тестах install.
      - run: python scripts/update_codex_plugin_manifest.py --check
      - run: pytest -q

  launcher-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" uv
      - run: >-
          pytest
          tests/entrypoints/test_launcher.py
          tests/entrypoints/test_launcher_contract.py
          tests/launcher
          tests/test_infrastructure_policy.py::test_unit_test_cannot_create_python_socket
          tests/test_infrastructure_policy.py::test_unit_test_allows_in_process_socketpair
          tests/test_infrastructure_policy.py::test_unit_test_allows_asyncio_internal_wakeup_socketpair
          -q
      - run: uv build
      - run: python scripts/verify_launcher_distribution.py dist
