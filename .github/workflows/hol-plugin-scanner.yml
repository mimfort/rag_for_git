name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@6bf4e9d7b49a9f245f5ac6046366d167c5145d40  # v1
        with:
          # Сканируем сам плагин, а не весь репозиторий: при plugin_dir "." в скан
          # попадали eval-репорты, и энтропийная эвристика принимала имена файлов
          # планов в markdown-таблицах за секреты (high → падение по fail_on_severity).
          plugin_dir: "plugin"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
