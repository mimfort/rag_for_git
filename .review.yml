# Политика ревью и конфиг доски задач.
# Читается из base-ветки PR (PR не может ослабить собственное ревью).
# Все ключи опциональны; заданные переопределяют env-дефолты (reviewer/config/settings.py).
# Полный разбор политики — в README.md и reviewer/policy/policy.py.

# Доска задач: registered provider + generic targets/options; credentials живут только в env.
# Полная matrix, setup, rotation и legacy migration: docs/board-providers.md.
task_board:
  type: yougile
  project: PRI
  key_pattern: 'PRI-\d+'
  create_target: null
  done_target: Готово
  options: {}
  # sync_filter:
  #   max_age_days: 180
  #   include_archived: false

# --- Скилл solve-task ---

# Дописывать в бриф solve-task расход LLM-токенов на этап (4 бакета:
# fresh-in/output/cache-write/cache-read). Считает PostToolUse-хук плагина
# (plugin/hooks/brief_cost.py) детерминированно по транскрипту сессии — ноль
# доп. LLM-токенов, без долларов. Дефолт (без ключа) — выключено.
solve_task:
  brief_token_cost: true

# --- Политика контекст-слоя (PRI-161) ---

# Игнорируемые пути: НЕ индексируются (вектора + граф) и не комментируются.
# Паттерны fnmatch. Голое имя папки ловит всё поддерево; '<dir>/*' — то же явно;
# glob — напр. '*.gen.py'. Берётся из целевой/индексируемой ветки (PR не ослабляет своё ревью).
paths:
  ignore:
    - eval                           # эвал-харнес агента: не продакшн-код, не нужен в ревью-индексе
    - reviewer/graph/scip_pb2.py     # сгенерированный protobuf-файл
    - sync_chunk.py                  # ручная утилита синка задач; не продакшн-код, дублирует reviewer/tasks/sync.py

# Глубина кластеризации сводок подсистем (число сегментов пути). Дефолт из env (2).
summary_cluster_depth: 2

# Точечные переопределения глубины по поддеревьям (longest-prefix-match по сегментам).
# Глубже (depth↑) → мельче кластеры → точечная инвалидация при правках, богаче приор;
# крупнее (depth↓) → обобщённее, но структурная правка пересобирает весь кластер —
# уместно лишь для СТАБИЛЬНЫХ, редко меняющихся поддеревьев.
# Сейчас переопределений нет: ни одно поддерево не сочетает размер >20 файлов
# с активностью выше медианной (4.5 коммита/файл за 6 мес.).
summary_cluster_depth_overrides: {}

# Порог масштаба приора сводок: число сводок > порога → ANN top-k по близости, иначе все.
summary_topk_threshold: 20

# --- Лимиты контекста retrieval-тулов (PRI-202) ---

# Адаптивный охват контекста: top_k подбирается сам по «обрыву» (cliff) скоров
# реранкера, а эти ключи — предохранители (floor/ceiling) и тюнинг отсечки.
# Env-слоя НЕТ: отсутствие ключа → дефолт-константа из reviewer/policy/context_limits.py.
# Значения ниже совпадают с дефолтами и выписаны явно ради видимости/документации
# (репозиторий одиночный, не монорепа → потолки не поднимаем).
context_limits:
  # search_codebase: гибрид + graph-expansion + Voyage rerank, отсечка по cliff.
  search_codebase:
    floor: 4                # минимум чанков всегда (даже при обрыве на 1-м хите)
    ceiling: 15             # жёсткий потолок (токены/Voyage); монорепа → 25-30
    ratio: 0.5              # брать пока score >= 0.5×(топ); ↑ строже, ↓ шире
    abs_floor: 0.3          # и score >= 0.3 по абсолюту — режет шум
    candidate_pool: 30      # верхний предел кандидатов до реранка (recall ↔ стоимость Voyage)
    ann_distance_max: 0.65  # ANN-префильтр: отбросить кандидата с cosine-дистанцией > порога
                            #   ДО реранка, ЕСЛИ он не BM25-хит; ниже → агрессивнее экономит Voyage
  # search_tasks: RRF-only (реранкера нет) → только статические рельсы, без cliff.
  search_tasks:
    floor: 3                # минимум задач всегда
    ceiling: 8              # потолок; борда с 2000+ задач → выше
  # graph: обход кода от топ-хитов (related_symbols / callers).
  graph:
    hops: 1                 # глубина обхода графа от топ-хитов
    callers_topk: 25        # cap callers на узел
