services:
  paradedb:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
      POSTGRES_DB: reviewer
    # loopback-only: локальный dev-стек не должен слушать LAN. Креды — одноразовые dev-дефолты.
    ports: ["127.0.0.1:5433:5432"]   # 5433 на хосте: 5432 занят локальным Postgres разработчика
    volumes: ["paradedb_data:/var/lib/postgresql/"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/reviewerpass
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j_data:/data"]
  # ============================================================================
  # ВАЖНО: test-profile использует общий Compose project с dev-сервисами.
  # Безопасное удаление: docker compose --profile test rm -sfv paradedb-test neo4j-test
  # НИКОГДА не используйте `docker compose --profile test down -v`: это остановит
  # dev-сервисы и удалит production named volumes.
  #
  # start_interval требует Docker Engine >= 25.0 / API >= 1.44: на старых движках
  # ключ игнорируется, стартовые пробы идут с редким interval и `up -d --wait`
  # ждёт минутами вместо секунд.
  # ============================================================================
  paradedb-test:
    image: paradedb/paradedb@sha256:dbd64f0eb2716b8466afe54b91fec782f4107a8d0e6bd3660b89c88a1ded2ead
    profiles: ["test"]
    environment:
      POSTGRES_USER: reviewer_test
      POSTGRES_PASSWORD: reviewer_test
      POSTGRES_DB: reviewer_test
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer_test -d reviewer_test"]
      start_period: 180s
      start_interval: 2s
      interval: 30s
      timeout: 2s
      retries: 3
  neo4j-test:
    image: neo4j@sha256:0b5d3ab6ec1b866890dbfb53bf4fe1cf039f9e03c96165599a403005b7e7bcc3
    profiles: ["test"]
    environment:
      NEO4J_AUTH: neo4j/reviewer_test_pass
    ports: ["127.0.0.1:17474:7474", "127.0.0.1:17687:7687"]
    tmpfs: ["/data", "/logs"]
    # cypher-shell поднимает JVM (~2.5 с CPU за вызов): в простое проба идёт раз в 5 минут,
    # частые пробы — только в фазе старта (start_period + start_interval).
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p reviewer_test_pass 'RETURN 1'"]
      start_period: 180s
      start_interval: 2s
      interval: 300s
      timeout: 3s
      retries: 3
volumes:
  paradedb_data:
  neo4j_data:
