services:
  paradedb:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
      POSTGRES_DB: reviewer
    # loopback-only: локальный dev-стек не должен слушать LAN. Креды — одноразовые dev-дефолты.
    ports: ["127.0.0.1:5433:5432"]   # 5433 на хосте: 5432 занят локальным Postgres разработчика
    volumes: ["paradedb_data:/var/lib/postgresql/"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/reviewerpass
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j_data:/data"]
  web:
    # Веб-админка наблюдаемости: фронт собирается внутри образа, бэкенд (FastAPI)
    # отдаёт SPA + JSON-API. Читает ту же БД, что пишет `reviewer review` на хосте.
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # внутри compose-сети Postgres доступен как paradedb:5432 (не host:5433)
      PG_DSN: postgresql://reviewer:reviewer@paradedb:5432/reviewer
    ports: ["127.0.0.1:8000:8000"]   # loopback-only, как остальной стек
    depends_on: ["paradedb"]
volumes:
  paradedb_data:
  neo4j_data:
